<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="deck@1">
  <title>Deck title</title>
  <!--
    Artfct deck starter (deck@1). Fill the slide slots and nothing else:
      slide  one <section class="slide"> per slide, in order
      title  the slide's <h1> (first slide) or <h2> (the rest)
      body   <p>, <ul>, <figure> and <img> inside the slide
      notes  optional <p class="notes"> as the last child of a slide (hidden on stage, indexed)
    Upgrade rule: replace deck.css and app.js only, never this file.
    Navigation from script: window.artfctDeck.goTo(index), 0-based, and window.artfctDeck.slideCount.
  -->
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <main class="deck-stage" aria-label="Slides">
    <section class="slide">
      <p class="kicker">Deck</p>
      <h1>Deck title</h1>
      <p>One line that says what this deck settles.</p>
      <p class="notes">Speaker notes for slide 1.</p>
    </section>
    <section class="slide">
      <h2>First point</h2>
      <ul>
        <li>Key point one</li>
        <li>Key point two</li>
        <li>Key point three</li>
      </ul>
      <p class="notes">Speaker notes for slide 2.</p>
    </section>
    <section class="slide">
      <h2>Next step</h2>
      <p>Say what the reader should do after this deck.</p>
      <p class="notes">Speaker notes for slide 3.</p>
    </section>
  </main>
  <script src="app.js" defer></script>
  <script src="probe.js" defer></script>
</body>
</html>
