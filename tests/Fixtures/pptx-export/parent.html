<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PowerPoint export parent fixture</title>
</head>
<body>
  <p id="status">running</p>
  <script src="/vendor/pptx-export/export.js"></script>
  <script>
    // Test fixture only (not part of the app). Checks the deck from the parent side,
    // then runs the export runner against the same deck.
    (function () {
      var params = new URLSearchParams(location.search);
      var starter = params.get('starter');
      var deckUrl = starter + '/index.html';
      window.results = {};

      function ask(frame, cmd, id) {
        return new Promise(function (resolve) {
          function onMessage(event) {
            if (event.source !== frame.contentWindow || !event.data || event.data.id !== id) {
              return;
            }
            window.removeEventListener('message', onMessage);
            resolve(event.data);
          }

          window.addEventListener('message', onMessage);
          frame.contentWindow.postMessage({ channel: 'artfct-export', v: 1, id: id, cmd: cmd }, starter);
        });
      }

      var probe = document.createElement('iframe');
      probe.title = 'probe';
      probe.src = deckUrl;
      document.body.appendChild(probe);

      probe.addEventListener('load', function () {
        try {
          void probe.contentWindow.document;
          window.results.crossOriginAccess = 'allowed';
        } catch (error) {
          window.results.crossOriginAccess = error.name;
        }

        ask(probe, 'ready', 'probe-ready')
          .then(function () {
            return ask(probe, 'describe', 'probe-describe');
          })
          .then(function (reply) {
            window.results.deckParentAccess = reply.result.slides[0].notes;
            probe.remove();

            return window.artfctPptxExport.run({ frameUrl: deckUrl, exportUrl: location.origin + '/export' });
          })
          .then(function (file) {
            window.results.filename = file.filename;
            window.results.captures = file.captures;
            document.getElementById('status').textContent = 'done';
          }, function (error) {
            window.results.error = error.code || error.message;
            document.getElementById('status').textContent = 'failed';
          });
      });
    })();
  </script>
</body>
</html>
