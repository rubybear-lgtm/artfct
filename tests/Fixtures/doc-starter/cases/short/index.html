<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="doc@1">
  <title>Doc starter short case</title>
  <link rel="stylesheet" href="doc.css">
</head>
<body>
  <!-- Test fixture only: a one-page memo in the default flowing sheet. -->
  <main class="sheet">
    <header class="doc-title">
      <p class="doc-kicker">Memo</p>
      <h1>Short memo title</h1>
    </header>
    <p class="doc-byline">Fixture author, date, audience</p>
    <article class="doc-body">
      <p>One short paragraph. It says what the memo settles and nothing more.</p>
    </article>
    <footer class="doc-footer">Source or contact line</footer>
  </main>
  <script src="export.js" defer></script>
</body>
</html>
