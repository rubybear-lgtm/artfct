<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="doc@1">
  <title>Doc starter page-start case</title>
  <link rel="stylesheet" href="doc.css">
</head>
<body>
  <!-- Test fixture only: a short memo with one forced page break before the second paragraph. -->
  <main class="sheet">
    <header class="doc-title">
      <p class="doc-kicker">Memo</p>
      <h1>Forced break memo</h1>
    </header>
    <p class="doc-byline">Fixture author, date, audience</p>
    <article class="doc-body">
      <p>Page one paragraph.</p>
      <p class="page-start">Page two starts here.</p>
      <p>Page two continues.</p>
    </article>
    <footer class="doc-footer">Source or contact line</footer>
  </main>
  <script src="export.js" defer></script>
</body>
</html>
