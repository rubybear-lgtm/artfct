{
  "openapi": "3.1.0",
  "info": {
    "title": "artfct API",
    "version": "1.0.0",
    "description": "The data-plane API for encrypted ephemeral artifacts and permanent artifact bundles.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    }
  },
  "servers": [
    {
      "url": "https://artfct.dev"
    }
  ],
  "tags": [
    { "name": "Artifacts", "description": "Create, update, delete, and upload artifacts." },
    { "name": "Previews", "description": "Resolve public artifact preview URLs." },
    { "name": "Administration", "description": "Organization governance and export operations." },
    { "name": "Retrieval", "description": "Search an organization's accessible artifacts." },
    { "name": "MCP", "description": "MCP client registration and connection lifecycle." }
  ],
  "paths": {
    "/internal/worker-events": {
      "post": {
        "tags": ["Administration"],
        "summary": "Receive a Worker event",
        "description": "Internal. Fire-and-forget Worker to Laravel event channel. Authenticated by X-Artfct-Timestamp and X-Artfct-Signature (hex HMAC-SHA256 of timestamp + \".\" + raw body, 300 s tolerance). A replayed event id returns 200 and does nothing; an unknown type is accepted and ignored.",
        "operationId": "receiveWorkerEvent",
        "x-internal": true,
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["id", "type", "org_id", "occurred_at", "data"],
                "properties": {
                  "id": { "type": "string", "format": "uuid" },
                  "type": { "type": "string", "examples": ["artifact.created", "artifact.viewed"] },
                  "org_id": { "type": "string" },
                  "occurred_at": { "type": "string", "format": "date-time" },
                  "data": { "type": "object" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Duplicate event id; nothing done." },
          "202": { "description": "Event accepted." },
          "401": { "description": "Bad signature or stale timestamp." },
          "422": { "description": "Malformed envelope." }
        }
      }
    },
    "/v1/artifacts": {
      "get": {
        "tags": ["Administration"],
        "summary": "List artifacts",
        "description": "Reserved admin listing endpoint.",
        "operationId": "listArtifacts",
        "x-status": "unimplemented",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "responses": {
          "501": { "$ref": "#/components/responses/NotImplemented" }
        }
      },
      "post": {
        "tags": ["Artifacts"],
        "summary": "Create an artifact",
        "description": "Creates an anonymous encrypted artifact or starts an authenticated permanent bundle upload. Anonymous access is allowed only when mode is ephemeral.",
        "operationId": "createArtifact",
        "security": [
          {},
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateArtifactRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Artifact created or permanent upload initialized.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CreateArtifactResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "413": { "$ref": "#/components/responses/PayloadTooLarge" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "options": {
        "tags": ["Artifacts"],
        "summary": "Preflight artifact collection requests",
        "operationId": "optionsArtifacts",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/v1/artifacts/{id}": {
      "parameters": [
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "get": {
        "tags": ["Artifacts"],
        "summary": "Read one artifact's credential-scoped metadata",
        "description": "Returns safe artifact metadata for the organization resolved from the bearer credential. It never returns the artifact HTML or bundle contents.",
        "operationId": "getArtifactMetadata",
        "security": [{ "orgToken": [] }],
        "responses": {
          "200": {
            "description": "Artifact metadata.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ArtifactMetadata" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "patch": {
        "tags": ["Artifacts"],
        "summary": "Update an artifact expiration",
        "operationId": "updateArtifact",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/UpdateArtifactRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Artifact expiration updated.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/UpdateArtifactResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "delete": {
        "tags": ["Artifacts"],
        "summary": "Delete an artifact",
        "operationId": "deleteArtifact",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "responses": {
          "204": {
            "description": "Artifact deleted. The response has no body."
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "description": "The artifact is under legal hold and was not deleted. The error details carry reason legal_hold." },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "options": {
        "tags": ["Artifacts"],
        "summary": "Preflight artifact item requests",
        "operationId": "optionsArtifact",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/p/{id}": {
      "parameters": [
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "get": {
        "tags": ["Previews"],
        "summary": "Render an artifact preview",
        "operationId": "renderArtifact",
        "security": [],
        "responses": {
          "200": {
            "description": "HTML preview shell or permanent artifact entrypoint.",
            "headers": {
              "Content-Security-Policy": {
                "schema": { "type": "string" }
              },
              "X-Content-Type-Options": {
                "schema": { "type": "string", "const": "nosniff" }
              }
            },
            "content": {
              "text/html": {
                "schema": { "type": "string" }
              }
            }
          },
          "404": {
            "description": "Artifact is missing, expired, incomplete, or inaccessible.",
            "content": {
              "text/html": {
                "schema": { "type": "string" }
              }
            }
          },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "options": {
        "tags": ["Previews"],
        "summary": "Preflight artifact preview requests",
        "operationId": "optionsArtifactPreview",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/p/{id}/{path}": {
      "parameters": [
        { "$ref": "#/components/parameters/ArtifactId" },
        { "$ref": "#/components/parameters/RelativePath" }
      ],
      "get": {
        "tags": ["Previews"],
        "summary": "Serve a file from a permanent artifact bundle",
        "operationId": "renderArtifactFile",
        "security": [],
        "responses": {
          "200": {
            "description": "Bundle file bytes.",
            "headers": {
              "X-Content-Type-Options": {
                "schema": { "type": "string", "const": "nosniff" }
              }
            },
            "content": {
              "application/octet-stream": {
                "schema": { "type": "string", "format": "binary" }
              }
            }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/v1/artifacts/{id}/files/{sha256}": {
      "parameters": [
        { "$ref": "#/components/parameters/ArtifactId" },
        { "$ref": "#/components/parameters/Sha256" }
      ],
      "put": {
        "tags": ["Artifacts"],
        "summary": "Upload a missing permanent artifact file",
        "operationId": "uploadArtifactFile",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/octet-stream": {
              "schema": { "type": "string", "format": "binary" }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Permanent artifact file uploaded. The response has no body."
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "413": { "$ref": "#/components/responses/PayloadTooLarge" }
        }
      },
      "options": {
        "tags": ["Artifacts"],
        "summary": "Preflight artifact file upload requests",
        "operationId": "optionsArtifactFile",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/v1/blobs/{sha256}": {
      "parameters": [
        { "$ref": "#/components/parameters/Sha256" }
      ],
      "get": {
        "tags": ["Administration"],
        "summary": "Download one exported raw blob",
        "operationId": "downloadExportBlob",
        "security": [ { "orgToken": [] } ],
        "responses": {
          "200": {
            "description": "Raw blob bytes",
            "content": { "application/octet-stream": { "schema": { "type": "string", "format": "binary" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/orgs/{org}/artifacts": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" }
      ],
      "get": {
        "tags": ["Administration"],
        "summary": "List an organization's artifacts",
        "operationId": "listOrganizationArtifacts",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "parameters": [
          { "name": "repo_url", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "agent", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "created_after", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" } },
          { "name": "created_before", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" } },
          { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 200 } }
        ],
        "responses": {
          "200": {
            "description": "A page of artifacts, cursor-paginated on (created_at, id).",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["artifacts", "next_cursor"],
                  "properties": {
                    "artifacts": { "type": "array", "items": { "type": "object" } },
                    "next_cursor": { "type": ["string", "null"] }
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "options": {
        "tags": ["Administration"],
        "summary": "Preflight organization artifact list requests",
        "operationId": "optionsOrganizationArtifacts",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/v1/orgs/{org}/artifacts/{id}": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" },
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "patch": {
        "tags": ["Administration"],
        "summary": "Revoke an organization artifact",
        "operationId": "revokeOrganizationArtifact",
        "security": [
          { "orgToken": [] },
          { "sessionJwt": [] }
        ],
        "responses": {
          "200": {
            "description": "The artifact, soft-deleted: revoked_at set, row and blob retained.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["id", "org_id", "revoked_at"],
                  "properties": {
                    "id": { "type": "string" },
                    "org_id": { "type": "string" },
                    "revoked_at": { "type": "string", "format": "date-time" }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "options": {
        "tags": ["Administration"],
        "summary": "Preflight organization artifact item requests",
        "operationId": "optionsOrganizationArtifact",
        "security": [],
        "responses": {
          "204": { "$ref": "#/components/responses/Preflight" }
        }
      }
    },
    "/v1/orgs/{org}/artifacts/{id}/content": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" },
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "get": {
        "tags": ["Administration"],
        "summary": "Read an artifact's entrypoint and provenance",
        "description": "Org-credentialed read used by server-side indexing. Revoked artifacts and artifacts of other organizations return 404.",
        "operationId": "readOrganizationArtifactContent",
        "security": [
          { "orgToken": [] }
        ],
        "responses": {
          "200": {
            "description": "The entrypoint text and provenance.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["id", "content_type", "provenance", "content"],
                  "properties": {
                    "id": { "type": "string" },
                    "content_type": { "type": "string" },
                    "provenance": {
                      "type": "object",
                      "properties": {
                        "agent": { "type": ["string", "null"] },
                        "repo_url": { "type": ["string", "null"] },
                        "commit_sha": { "type": ["string", "null"] }
                      }
                    },
                    "content": { "type": "string" }
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/internal/jwks": {
      "post": {
        "tags": ["Administration"],
        "summary": "Publish the org-token public keys",
        "description": "Internal. Laravel publishes the JWKS the Worker verifies org tokens against. Authenticated with its own shared secret, not an org token. The body must contain at least one complete key (kid, n, e).",
        "operationId": "writeJwks",
        "x-internal": true,
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["keys"],
                "properties": {
                  "keys": {
                    "type": "array",
                    "minItems": 1,
                    "items": {
                      "type": "object",
                      "required": ["kid", "n", "e"],
                      "properties": {
                        "kty": { "type": "string" },
                        "use": { "type": "string" },
                        "alg": { "type": "string" },
                        "kid": { "type": "string" },
                        "n": { "type": "string" },
                        "e": { "type": "string" }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Keys stored." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/v1/internal/org-limits": {
      "post": {
        "tags": ["Administration"],
        "summary": "Push an organization's limits",
        "description": "Internal. Laravel pushes an org's quota limits and read-only (past due) state. Authenticated with the limits shared secret, not an org token. Rows are upserted; with no row the Worker uses default limits.",
        "operationId": "writeOrganizationLimits",
        "x-internal": true,
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["org", "storage_bytes", "artifacts_per_month", "bundle_ceiling_bytes", "read_only"],
                "properties": {
                  "org": { "type": "string" },
                  "storage_bytes": { "type": "integer", "minimum": 0 },
                  "artifacts_per_month": { "type": "integer", "minimum": 0 },
                  "bundle_ceiling_bytes": { "type": "integer", "minimum": 0 },
                  "read_only": { "type": "boolean" }
                }
              }
            }
          }
        },
        "responses": {
          "200": { "description": "Limits stored." },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/v1/orgs/{org}/usage": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" }
      ],
      "get": {
        "tags": ["Administration"],
        "summary": "Read an organization's usage",
        "description": "The figures the create gate enforces: storage counts each distinct blob once; artifacts_this_period counts artifacts created in the current UTC month.",
        "operationId": "readOrganizationUsage",
        "security": [
          { "orgToken": [] }
        ],
        "responses": {
          "200": {
            "description": "Current usage.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["storage_bytes", "artifacts_this_period"],
                  "properties": {
                    "storage_bytes": { "type": "integer", "minimum": 0 },
                    "artifacts_this_period": { "type": "integer", "minimum": 0 }
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/internal/orgs/{org}/governance/artifacts": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" }
      ],
      "get": {
        "tags": ["Administration"],
        "summary": "List artifacts for governance jobs",
        "description": "Internal. Cursor-paginated (limit max 500), includes revoked artifacts. older_than filters by created_at. Authenticated with the governance shared secret, not an org token.",
        "operationId": "listGovernanceArtifacts",
        "x-internal": true,
        "security": [],
        "parameters": [
          { "name": "older_than", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" } },
          { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 500 } }
        ],
        "responses": {
          "200": {
            "description": "A page of artifacts.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["artifacts", "next_cursor"],
                  "properties": {
                    "artifacts": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": ["id", "created_at", "legal_hold"],
                        "properties": {
                          "id": { "type": "string" },
                          "created_at": { "type": "string" },
                          "legal_hold": { "type": "boolean" }
                        }
                      }
                    },
                    "next_cursor": { "type": ["string", "null"] }
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/internal/orgs/{org}/governance/artifacts/{id}": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" },
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "delete": {
        "tags": ["Administration"],
        "summary": "Hard-delete an artifact",
        "description": "Internal. Irreversibly deletes the artifact, decrements blob references and removes unreferenced blobs from storage. Refused with 409 while the artifact is under legal hold. Writes an artifact.hard_deleted audit event.",
        "operationId": "hardDeleteGovernanceArtifact",
        "x-internal": true,
        "security": [],
        "responses": {
          "204": { "description": "Artifact deleted." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "description": "The artifact is under legal hold." }
        }
      }
    },
    "/v1/internal/orgs/{org}/governance/artifacts/{id}/legal-hold": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" },
        { "$ref": "#/components/parameters/ArtifactId" }
      ],
      "put": {
        "tags": ["Administration"],
        "summary": "Place a legal hold",
        "description": "Internal. Audited as legal_hold.placed.",
        "operationId": "placeGovernanceLegalHold",
        "x-internal": true,
        "security": [],
        "responses": {
          "204": { "description": "Hold placed." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "delete": {
        "tags": ["Administration"],
        "summary": "Release a legal hold",
        "description": "Internal. Audited as legal_hold.released.",
        "operationId": "releaseGovernanceLegalHold",
        "x-internal": true,
        "security": [],
        "responses": {
          "204": { "description": "Hold released." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/internal/orgs/{org}/governance/sweep-orphans": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" }
      ],
      "post": {
        "tags": ["Administration"],
        "summary": "Sweep zero-reference blobs",
        "description": "Internal. Removes blobs no artifact references, left behind by a failed storage delete.",
        "operationId": "sweepGovernanceOrphans",
        "x-internal": true,
        "security": [],
        "responses": {
          "200": {
            "description": "Number of blobs removed.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["removed"],
                  "properties": { "removed": { "type": "integer", "minimum": 0 } }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/orgs/{org}/export": {
      "parameters": [
        { "$ref": "#/components/parameters/OrganizationId" }
      ],
      "get": {
