        }
      }
    },
    "/oauth/organizations": {
      "get": {
        "tags": ["MCP"],
        "summary": "List organizations available to the authenticated OAuth user",
        "operationId": "oauthOrganizations",
        "security": [{ "orgToken": [] }],
        "responses": {
          "200": {
            "description": "Organizations available to the OAuth user.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OAuthOrganizationsResponse" } } }
          },
