        "description": "Registers an MCP client using the authenticated organization token. The credential itself is never returned or persisted; only its non-secret token identifier is retained for revocation and usage tracking.",
        "operationId": "registerMcpConnection",
        "security": [{ "orgToken": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
