        }
      }
    },
    "/oauth/register": {
      "post": {
        "tags": ["MCP"],
        "summary": "Register a public MCP OAuth client",
        "operationId": "oauthRegisterClient",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/OAuthClientRegistrationRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Registered public OAuth client.",
