          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/mcp/connections/heartbeat": {
      "post": {
        "tags": ["MCP"],
        "summary": "Refresh an MCP connection heartbeat",
        "description": "Updates last-used time for the current token-bound MCP connection and rejects revoked or expired connections.",
        "operationId": "heartbeatMcpConnection",
        "security": [{ "orgToken": [] }],
        "responses": {
          "200": {
            "description": "MCP connection is active.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/McpConnectionResponse" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/.well-known/oauth-authorization-server": {
      "get": {
        "tags": ["MCP"],
        "summary": "Discover the MCP authorization server",
        "operationId": "oauthAuthorizationServerMetadata",
        "security": [],
        "responses": {
          "200": {
            "description": "OAuth authorization server metadata.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OAuthAuthorizationServerMetadata" } } }
          },
          "404": { "description": "Metadata endpoint not found." }
        }
      }
    },
    "/mcp": {
      "post": {
        "tags": ["MCP"],
        "summary": "Process a Streamable HTTP MCP request",
        "description": "Authenticated JSON-RPC MCP transport. Clients discover bearer authorization through the protected-resource metadata endpoint and send the resulting access token in the Authorization header.",
        "operationId": "mcpStreamableHttp",
        "security": [{ "orgToken": [] }],
        "parameters": [
          {
            "name": "MCP-Session-Id",
            "in": "header",
            "required": false,
            "schema": { "type": "string" }
          },
          {
            "name": "MCP-Request-Id",
            "in": "header",
            "required": false,
            "description": "Optional stable request identity used to safely replay a mutating tool call.",
            "schema": { "type": "string", "maxLength": 128 }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "description": "Alias for MCP-Request-Id for clients with generic retry middleware.",
            "schema": { "type": "string", "maxLength": 128 }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/JsonRpcRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "JSON-RPC response.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/JsonRpcResponse" } } }
          },
          "202": { "description": "JSON-RPC notification accepted." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "405": { "description": "Method not allowed." }
        }
      }
    },
    "/.well-known/oauth-protected-resource": {
      "get": {
        "tags": ["MCP"],
        "summary": "Discover the protected MCP resource",
        "operationId": "oauthProtectedResourceMetadata",
        "security": [],
        "responses": {
          "200": {
            "description": "OAuth protected resource metadata.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OAuthProtectedResourceMetadata" } } }
          },
          "404": { "description": "Metadata endpoint not found." }
        }
      }
    },
    "/oauth/token": {
      "post": {
