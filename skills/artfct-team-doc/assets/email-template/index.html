<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="email@1">
  <title>Email subject line</title>
  <!--
    Artfct customer email template (email@1). Table layout, 600px wide, inline style attributes, no script.
    Fill the slots: logo, greeting, body, sign-off. Keep the logo as the bundled logo.svg path.
    Email is not sent from Artfct. This file is the text and layout a sender copies into an email client.
    Upgrade rule: replace the inline styles only, never the slots.
  -->
</head>
<body style="margin:0; padding:0; background-color:#f7f5f2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f5f2;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#fbfaf8; border:1px solid #dedad2;">
          <tr>
            <td style="padding:24px 32px 8px 32px;">
              <img src="logo.svg" width="160" height="40" alt="Company logo" style="display:block; border:0; outline:none;">
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 0 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#262624;">
              <p style="margin:0 0 16px 0;">Hello [first name],</p>
              <p style="margin:0 0 16px 0;">One short paragraph that says why you are writing and what you need from the reader.</p>
              <p style="margin:0 0 16px 0;">A second short paragraph with the one detail that matters: the date, the price or the next step.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#262624;">
              <p style="margin:0;">[Sender name]<br>[Sender role]</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
