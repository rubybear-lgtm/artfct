<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="doc@1">
  <title>Document title</title>
  <!--
    Artfct doc starter (doc@1). Fill the four content slots and nothing else:
      title   <header class="doc-title"> heading and kicker
      byline  <p class="doc-byline"> author, date, audience
      body    <article class="doc-body"> text, lists, tables, figures
      footer  <footer class="doc-footer"> source, contact, version
    Upgrade rule: replace doc.css and export.js only, never this file.
    A4: add class "sheet-a4" to <html>. One fixed page: add "sheet--fixed" to <main>.
  -->
  <link rel="stylesheet" href="doc.css">
</head>
<body>
  <main class="sheet">
    <header class="doc-title">
      <p class="doc-kicker">Document</p>
      <h1>Document title</h1>
    </header>
    <p class="doc-byline">Author, date, audience</p>
    <article class="doc-body">
      <p>Write the document here. Keep each paragraph short and say what it settles.</p>
    </article>
    <footer class="doc-footer">Source or contact line</footer>
  </main>
  <script src="export.js" defer></script>
</body>
</html>
