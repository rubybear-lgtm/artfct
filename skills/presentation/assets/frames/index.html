<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo frames sample</title>
  <link rel="stylesheet" href="browser.css">
  <link rel="stylesheet" href="phone.css">
  <link rel="stylesheet" href="desktop.css">
  <style>
    main > .frame + .frame { margin-top: 48px; }
  </style>
</head>
<body>
  <main>
    <section class="frame frame-browser">
      <div class="frame-chrome" aria-hidden="true"></div>
      <figure class="frame-slot">
        <img src="sample-shot.svg" alt="Sample dashboard with a sidebar, a title bar and two summary cards">
      </figure>
    </section>

    <section class="frame frame-phone">
      <div class="frame-chrome" aria-hidden="true"></div>
      <figure class="frame-slot">
        <img src="sample-shot.svg" alt="Sample mobile screen showing the summary cards stacked">
      </figure>
    </section>

    <section class="frame frame-desktop">
      <figure class="frame-slot">
        <img src="sample-shot.svg" alt="Sample desktop screen with a title, body text and a call to action">
      </figure>
      <div class="frame-chrome" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
