<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="artfct-starter" content="context-post">
  <title>Post title</title>
  <link rel="stylesheet" href="post.css">
</head>
<body>
  <main class="post">
    <header class="post-head">
      <p class="post-kicker">Context post</p>
      <h1>Post title</h1>
      <p class="post-summary">One sentence on what this post settles or announces.</p>
    </header>

    <section class="post-details" data-post-details aria-label="Post details">
      <dl>
        <div><dt>Kind</dt><dd data-field="kind">decision</dd></div>
        <div><dt>Owner</dt><dd data-field="owner">Not set</dd></div>
        <div><dt>Date</dt><dd data-field="date">Not set</dd></div>
        <div><dt>Status</dt><dd data-field="status">draft</dd></div>
        <div><dt>Replaced by</dt><dd data-field="replaced_by">None</dd></div>
      </dl>
    </section>

    <article class="post-body">
      <p>Write the post here. Keep it short and say what changed.</p>
    </article>
  </main>
  <script src="app.js"></script>
</body>
</html>
